$kind: http-example
name: Registration successful
request:
  url: http://localhost:3000/api/v1/auth/register
  method: POST
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Registration successful",
        "user": {
          "id": "123",
          "name": "Taylor Morgan",
          "email": "taylor.morgan@example.com",
          "roleId": 1
        }
      }
order: 1000
