$kind: http-request
name: Register
url: http://localhost:3000/api/v1/auth/register
method: POST
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Taylor Morgan",
      "email": "taylor.morgan@example.com",
      "password": "SecurePass123!"
    }
examples: './.resources/Register.resources/examples'
